services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    command: etcd --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://0.0.0.0:2379
    ports:
      - "2379:2379"
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 5s
      timeout: 3s
      retries: 10
